name: Validate BillFlow source
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: node --test tests/suite-auth.test.mjs
      - run: npm run build
# Production is served by Cloudflare Workers. GitHub Pages publication is retired.
